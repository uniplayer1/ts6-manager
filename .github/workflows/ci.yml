name: CI

on:
  push:
    branches: [main, security-hardening]
    tags: ['v*']
  pull_request:

# GITHUB_TOKEN needs write access to GHCR to push images (the docker job
# publishes backend/sidecar/frontend to ghcr.io/uniplayer1/ts6-manager).
permissions:
  contents: read
  packages: write

jobs:
  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build common package
        run: pnpm --filter @ts6/common run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  sidecar:
    name: Build and vet Go sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/sidecar/go.mod
          cache-dependency-path: packages/sidecar/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            name: backend
          - dockerfile: Dockerfile.sidecar
            name: sidecar
          - dockerfile: Dockerfile.frontend
            name: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/uniplayer1/ts6-manager
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: "${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
